import net.darkhax.curseforgegradle.TaskPublishCurseForge

buildscript {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            url = "https://jitpack.io"
        }
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath('com.github.GTNewHorizons:ForgeGradle:1.2.11') {
            // This transitive dependency breaks plugins for some reason. Only GTNH-FG has this issue.
            exclude group: "org.eclipse.equinox"
        }
        classpath("net.darkhax.curseforgegradle:CurseForgeGradle:1.+")
        classpath("com.modrinth.minotaur:Minotaur:2.+")
    }
}

plugins {
    id 'java-library'
}

apply from: "buildscript/forge-1.7.gradle"
